<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RYZEN MENU</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0a0f;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* ===== HOA ĐÀO RƠI CANVAS ===== */
        #sakuraCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ===== MENU CHÍNH ===== */
        .menu-container {
            position: fixed;
            z-index: 10;
            width: min(440px, 94vw);
            max-height: 92vh;
            background: rgba(10, 10, 20, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 120, 180, 0.2);
            border-radius: 28px;
            padding: 22px 22px 26px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(255, 80, 150, 0.1);
            cursor: grab;
            transition: box-shadow 0.2s;
            overflow-y: auto;
            overflow-x: hidden;
            touch-action: none;
        }
        .menu-container:active {
            cursor: grabbing;
        }
        .menu-container.dragging {
            cursor: grabbing;
        }

        /* ===== CUSTOM SCROLLBAR ===== */
        .menu-container::-webkit-scrollbar {
            width: 4px;
        }
        .menu-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
        }
        .menu-container::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #f472b6, #ec4899);
            border-radius: 10px;
        }

        /* ===== HEADER ===== */
        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding-bottom: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .menu-header h1 {
            color: #fff;
            font-size: clamp(18px, 5vw, 22px);
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #f9a8d4, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(244, 114, 182, 0.2);
        }
        .menu-header .badge {
            background: rgba(244, 114, 182, 0.15);
            border: 1px solid rgba(244, 114, 182, 0.2);
            color: #f9a8d4;
            font-size: 10px;
            padding: 3px 12px;
            border-radius: 40px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* ===== TOOLBAR TRÊN ===== */
        .toolbar {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 12px;
        }
        .toolbar .icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 30px;
            padding: 6px 14px;
            color: #aabbdd;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            gap: 6px;
            touch-action: manipulation;
        }
        .toolbar .icon-btn:hover {
            background: rgba(244, 114, 182, 0.12);
            border-color: rgba(244, 114, 182, 0.25);
            color: #fff;
        }
        .toolbar .icon-btn.active {
            background: rgba(244, 114, 182, 0.2);
            border-color: #f472b6;
            color: #f9a8d4;
            box-shadow: 0 0 20px rgba(244, 114, 182, 0.1);
        }
        .toolbar .icon-btn .dot-indicator {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #66ff99;
            animation: pulseDot 1.8s infinite;
        }
        .toolbar .icon-btn.active .dot-indicator {
            background: #f472b6;
        }

        /* ===== KHU VỰC QUẠT ===== */
        .fan-section {
            display: flex;
            justify-content: space-around;
            margin: 14px 0 18px;
            gap: 10px;
        }
        .fan-box {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 18px;
            padding: 14px 8px 12px;
            flex: 1;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.4);
        }
        .fan-box .label {
            color: #8899bb;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 4px;
        }
        .fan {
            width: clamp(56px, 15vw, 72px);
            height: clamp(56px, 15vw, 72px);
            margin: 0 auto 4px;
            background: radial-gradient(circle, #1a1a2e, #0f0f1a);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: spinFan 3.2s linear infinite;
        }
        .fan::before {
            content: "❄";
            font-size: clamp(22px, 6vw, 30px);
            color: #66ccff;
            text-shadow: 0 0 20px rgba(102, 204, 255, 0.3);
            animation: spinFan 1.2s linear infinite reverse;
        }
        .fan::after {
            content: "";
            position: absolute;
            width: 12px;
            height: 12px;
            background: radial-gradient(circle, #2a2a44, #111);
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        @keyframes spinFan {
            to { transform: rotate(360deg); }
        }
        .fan-box .temp {
            color: #aabbdd;
            font-size: clamp(11px, 2.8vw, 13px);
            font-weight: 600;
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 10px;
            border-radius: 30px;
            display: inline-block;
            margin-top: 2px;
        }
        .fan-box .temp span {
            color: #66ddff;
        }

        /* ===== TOGGLE GRID ===== */
        .toggle-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 14px 0 12px;
        }
        .toggle-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: 0.2s;
            touch-action: manipulation;
        }
        .toggle-item:active {
            transform: scale(0.97);
        }
        .toggle-item .name {
            color: #ccd8f0;
            font-size: clamp(12px, 3vw, 14px);
            font-weight: 500;
        }
        .toggle-item .name small {
            color: #667799;
            font-size: 9px;
            font-weight: 300;
            margin-left: 3px;
            display: inline-block;
        }
        .switch {
            position: relative;
            width: 40px;
            height: 22px;
            background: #1e1e32;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.25s;
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
            touch-action: manipulation;
        }
        .switch.active {
            background: linear-gradient(135deg, #f472b6, #ec4899);
            border-color: #f472b6;
            box-shadow: 0 0 18px rgba(244, 114, 182, 0.25);
        }
        .switch .knob {
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            margin: 2px;
            transition: 0.25s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }
        .switch.active .knob {
            transform: translateX(18px);
            background: #fff;
        }

        /* ===== SLIDER NHẸ TÂM ===== */
        .slider-section {
            margin: 10px 0 14px;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .slider-section .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .slider-section .row .label {
            color: #ccd8f0;
            font-size: clamp(12px, 3vw, 14px);
            font-weight: 500;
        }
        .slider-section .row .value {
            color: #f9a8d4;
            font-weight: 700;
            font-size: clamp(13px, 3.2vw, 15px);
            background: rgba(0, 0, 0, 0.3);
            padding: 0 12px;
            border-radius: 30px;
        }
        input[type="range"] {
            width: 100%;
            margin-top: 4px;
            -webkit-appearance: none;
            background: transparent;
            touch-action: manipulation;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            height: 4px;
            background: #1e1e32;
            border-radius: 10px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: linear-gradient(135deg, #f472b6, #ec4899);
            border-radius: 50%;
            margin-top: -7px;
            box-shadow: 0 0 20px rgba(244, 114, 182, 0.3);
            cursor: pointer;
        }
        input[type="range"]::-moz-range-track {
            height: 4px;
            background: #1e1e32;
            border-radius: 10px;
            border: none;
        }
        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background: linear-gradient(135deg, #f472b6, #ec4899);
            border-radius: 50%;
            border: none;
            box-shadow: 0 0 20px rgba(244, 114, 182, 0.3);
            cursor: pointer;
        }

        /* ===== NÚT TỐI ƯU MÁY ===== */
        .optimize-btn {
            width: 100%;
            padding: 12px;
            margin: 4px 0 8px;
            background: linear-gradient(135deg, #1a1a2e, #0f0f1a);
            border: 1px solid rgba(244, 114, 182, 0.15);
            border-radius: 40px;
            color: #f0e8ff;
            font-weight: 700;
            font-size: clamp(13px, 3.2vw, 15px);
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            touch-action: manipulation;
        }
        .optimize-btn:active {
            transform: scale(0.97);
        }
        .optimize-btn:hover {
            background: linear-gradient(135deg, #2a1a3e, #1a0a2a);
            border-color: #f472b6;
            box-shadow: 0 0 40px rgba(244, 114, 182, 0.1);
        }
        .optimize-btn .icon {
            font-size: 16px;
        }
        .optimize-btn .status {
            color: #66ddff;
            font-size: 11px;
            font-weight: 400;
        }

        /* ===== FOOTER ===== */
        .menu-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            color: #445566;
            font-size: 10px;
            flex-wrap: wrap;
            gap: 4px;
        }
        .menu-footer .dot {
            color: #66ddff;
            animation: pulseDot 1.8s infinite;
        }
        .menu-footer .lock-status {
            color: #88aacc;
            font-weight: 500;
        }
        .menu-footer .lock-status.locked {
            color: #f472b6;
        }
        @keyframes pulseDot {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .menu-container {
                padding: 16px 14px 18px;
                max-height: 90vh;
                border-radius: 20px;
            }
            .toggle-grid {
                grid-template-columns: 1fr 1fr;
                gap: 6px;
            }
            .toggle-item {
                padding: 8px 10px;
                border-radius: 10px;
            }
            .fan-box {
                padding: 10px 4px 8px;
            }
            .toolbar .icon-btn {
                font-size: 10px;
                padding: 4px 10px;
            }
            .menu-header {
                margin-bottom: 12px;
            }
        }

        @media (max-width: 380px) {
            .toggle-grid {
                grid-template-columns: 1fr;
            }
            .fan-section {
                flex-direction: row;
            }
        }

        /* ===== SCROLL LOCK OVERLAY ===== */
        .scroll-lock-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            background: rgba(0, 0, 0, 0.3);
            pointer-events: none;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }
        .scroll-lock-overlay.active {
            display: block;
        }

        /* ===== TOAST THÔNG BÁO ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(10, 10, 20, 0.9);
            backdrop-filter: blur(16px);
            padding: 10px 24px;
            border-radius: 40px;
            border: 1px solid rgba(244, 114, 182, 0.2);
            color: #f0e8ff;
            font-size: 13px;
            font-weight: 500;
            z-index: 1000;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            white-space: nowrap;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast .toast-icon {
            margin-right: 8px;
        }
    </style>
</head>
<body>

    <!-- SCROLL LOCK OVERLAY (chặn scroll khi lock) -->
    <div class="scroll-lock-overlay" id="scrollLockOverlay"></div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <!-- CANVAS HOA ĐÀO -->
    <canvas id="sakuraCanvas"></canvas>

    <!-- ===== MENU ===== -->
    <div class="menu-container" id="menu">
        <div class="menu-header">
            <h1>🌸 RYZEN · MENU</h1>
            <span class="badge">v2.1 · PRO</span>
        </div>

        <!-- TOOLBAR -->
        <div class="toolbar">
            <div class="icon-btn" id="scrollLockBtn">
                <span>🔒</span> Scroll
                <span class="dot-indicator" id="scrollDot"></span>
            </div>
            <div class="icon-btn" id="resetPosBtn">
                <span>↺</span> Vị trí
            </div>
        </div>

        <!-- QUẠT -->
        <div class="fan-section">
            <div class="fan-box">
                <div class="label">🌀 CPU</div>
                <div class="fan"></div>
                <div class="temp">🌡️ <span id="cpuTemp">42</span>°C</div>
            </div>
            <div class="fan-box">
                <div class="label">🌀 GPU</div>
                <div class="fan"></div>
                <div class="temp">🌡️ <span id="gpuTemp">56</span>°C</div>
            </div>
        </div>

        <!-- TOGGLE -->
        <div class="toggle-grid">
            <div class="toggle-item">
                <span class="name">🎯 No Recoil <small></small></span>
                <div class="switch" data-toggle="norecoil"><div class="knob"></div></div>
            </div>
            <div class="toggle-item">
                <span class="name">🧊 Fix Rung <small>real</small></span>
                <div class="switch" data-toggle="fixrung"><div class="knob"></div></div>
            </div>
            <div class="toggle-item">
                <span class="name">🔒 Head Lock <small>real</small></span>
                <div class="switch" data-toggle="headlock"><div class="knob"></div></div>
            </div>
            <div class="toggle-item">
                <span class="name">⚡ Nhẹ tâm <small>real</small></span>
                <div class="switch active" data-toggle="nhetam"><div class="knob"></div></div>
            </div>
        </div>

        <!-- SLIDER -->
        <div class="slider-section">
            <div class="row">
                <span class="label">🎚️ Độ nhẹ tâm</span>
                <span class="value" id="smoothValue">72%</span>
            </div>
            <input type="range" id="smoothSlider" min="0" max="100" value="72">
        </div>

        <!-- NÚT TỐI ƯU -->
        <button class="optimize-btn" id="optimizeBtn">
            <span class="icon">🚀</span> TỐI ƯU MÁY
            <span class="status" id="optStatus">● sẵn sàng</span>
        </button>

        <!-- FOOTER -->
        <div class="menu-footer">
            <span><span class="dot">●</span> Ryzen ON TOP</span>
            <span class="lock-status" id="lockStatusDisplay">🔓 scroll: mở</span>
            <span id="fpsCounter">⚡ 144 FPS</span>
        </div>
    </div>

    <script>
        // ============================================================
        // 0. TOAST HELPER
        // ============================================================
        const toastEl = document.getElementById('toast');
        let toastTimer = null;

        function showToast(message, icon = '🌸') {
            toastEl.innerHTML = `<span class="toast-icon">${icon}</span> ${message}`;
            toastEl.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toastEl.classList.remove('show');
            }, 1800);
        }

        // ============================================================
        // 1. HOA ĐÀO RƠI
        // ============================================================
        const canvas = document.getElementById('sakuraCanvas');
        const ctx = canvas.getContext('2d');
        let W, H;

        function resizeCanvas() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const petals = [];
        const PETAL_COUNT = 70;

        function random(min, max) { return Math.random() * (max - min) + min; }

        class Petal {
            constructor() { this.reset(true); }
            reset(init = false) {
                this.x = random(0, W);
                this.y = init ? random(-H, 0) : -30;
                this.size = random(6, 14);
                this.speedY = random(0.8, 2.2);
                this.speedX = random(-0.6, 0.6);
                this.rotation = random(0, Math.PI * 2);
                this.rotSpeed = random(-0.03, 0.03);
                this.opacity = random(0.5, 0.95);
                this.wobble = random(0, 2);
                this.wobbleSpeed = random(0.02, 0.06);
                this.hue = random(330, 360);
                this.sat = random(50, 80);
                this.light = random(60, 85);
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.wobble) * 0.4;
                this.wobble += this.wobbleSpeed;
                this.rotation += this.rotSpeed;
                if (this.y > H + 20 || this.x < -30 || this.x > W + 30) {
                    this.reset(false);
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.globalAlpha = this.opacity;
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size * 0.5, this.size * 0.8, 0, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${this.hue}, ${this.sat}%, ${this.light}%)`;
                ctx.fill();
                ctx.shadowColor = 'rgba(255, 200, 220, 0.15)';
                ctx.shadowBlur = 8;
                ctx.restore();
            }
        }

        for (let i = 0; i < PETAL_COUNT; i++) {
            petals.push(new Petal());
        }

        function drawSakura() {
            ctx.clearRect(0, 0, W, H);
            petals.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(drawSakura);
        }
        drawSakura();

        // ============================================================
        // 2. KÉO THẢ MENU (HỖ TRỢ CẢ TOUCH)
        // ============================================================
        const menu = document.getElementById('menu');
        let isDragging = false;
        let offsetX = 0,
            offsetY = 0;
        let startX = 0,
            startY = 0;

        function getPos(e) {
            if (e.touches) {
                return { clientX: e.touches[0].clientX, clientY: e.touches[0].clientY };
            }
            return { clientX: e.clientX, clientY: e.clientY };
        }

        function onDragStart(e) {
            const target = e.target;
            if (target.closest('.switch') || target.closest('.optimize-btn') ||
                target.closest('input') || target.closest('.icon-btn')) return;
            const pos = getPos(e);
            const rect = menu.getBoundingClientRect();
            offsetX = pos.clientX - rect.left;
            offsetY = pos.clientY - rect.top;
            isDragging = true;
            menu.classList.add('dragging');
            e.preventDefault?.();
        }

        function onDragMove(e) {
            if (!isDragging) return;
            const pos = getPos(e);
            let x = pos.clientX - offsetX;
            let y = pos.clientY - offsetY;
            x = Math.max(0, Math.min(window.innerWidth - menu.offsetWidth, x));
            y = Math.max(0, Math.min(window.innerHeight - menu.offsetHeight, y));
            menu.style.left = x + 'px';
            menu.style.top = y + 'px';
            menu.style.position = 'fixed';
            e.preventDefault?.();
        }

        function onDragEnd() {
            isDragging = false;
            menu.classList.remove('dragging');
        }

        // Mouse
        menu.addEventListener('mousedown', onDragStart);
        document.addEventListener('mousemove', onDragMove);
        document.addEventListener('mouseup', onDragEnd);

        // Touch
        menu.addEventListener('touchstart', onDragStart, { passive: false });
        document.addEventListener('touchmove', onDragMove, { passive: false });
        document.addEventListener('touchend', onDragEnd, { passive: false });

        // ============================================================
        // 3. SCROLL LOCK
        // ============================================================
        let scrollLocked = false;
        const scrollLockBtn = document.getElementById('scrollLockBtn');
        const scrollDot = document.getElementById('scrollDot');
        const lockStatusDisplay = document.getElementById('lockStatusDisplay');
        const overlay = document.getElementById('scrollLockOverlay');

        function toggleScrollLock() {
            scrollLocked = !scrollLocked;
            if (scrollLocked) {
                scrollLockBtn.classList.add('active');
                scrollDot.style.background = '#f472b6';
                lockStatusDisplay.textContent = '🔒 scroll: khóa';
                lockStatusDisplay.classList.add('locked');
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
                showToast('Đã khóa scroll', '🔒');
            } else {
                scrollLockBtn.classList.remove('active');
                scrollDot.style.background = '#66ff99';
                lockStatusDisplay.textContent = '🔓 scroll: mở';
                lockStatusDisplay.classList.remove('locked');
                overlay.classList.remove('active');
                document.body.style.overflow = '';
                showToast('Đã mở scroll', '🔓');
            }
        }

        scrollLockBtn.addEventListener('click', toggleScrollLock);
        scrollLockBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            toggleScrollLock();
        }, { passive: false });

        // ============================================================
        // 4. RESET VỊ TRÍ MENU
        // ============================================================
        document.getElementById('resetPosBtn').addEventListener('click', () => {
            const rect = menu.getBoundingClientRect();
            const left = (window.innerWidth - rect.width) / 2;
            const top = (window.innerHeight - rect.height) / 2;
            menu.style.left = left + 'px';
            menu.style.top = top + 'px';
            menu.style.position = 'fixed';
            showToast('Đã reset vị trí menu', '↺');
        });
        document.getElementById('resetPosBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            document.getElementById('resetPosBtn').click();
        }, { passive: false });

        // ============================================================
        // 5. TOGGLE SWITCH (CHỈ UI)
        // ============================================================
        document.querySelectorAll('.switch').forEach(sw => {
            const clickHandler = function(e) {
                e.stopPropagation();
                this.classList.toggle('active');
                const name = this.dataset.toggle || 'unknown';
                const state = this.classList.contains('active') ? 'ON' : 'OFF';
                const iconMap = {
                    'norecoil': '🎯',
                    'fixrung': '🧊',
                    'headlock': '🔒',
                    'nhetam': '⚡'
                };
                showToast(`${iconMap[name] || '🔘'} ${name} → ${state}`, iconMap[name] || '🔘');
                console.log(`[UI] ${name} → ${state}`);
            };
            sw.addEventListener('click', clickHandler);
            sw.addEventListener('touchstart', (e) => {
                e.preventDefault();
                clickHandler.call(sw, e);
            }, { passive: false });
        });

        // ============================================================
        // 6. SLIDER
        // ============================================================
        const slider = document.getElementById('smoothSlider');
        const smoothVal = document.getElementById('smoothValue');
        slider.addEventListener('input', () => {
            smoothVal.textContent = slider.value + '%';
        });
        slider.addEventListener('touchstart', () => {}, { passive: true });

        // ============================================================
        // 7. NÚT TỐI ƯU
        // ============================================================
        const optBtn = document.getElementById('optimizeBtn');
        const optStatus = document.getElementById('optStatus');

        function runOptimize() {
            optStatus.textContent = '⏳ đang tối ưu...';
            optStatus.style.color = '#ffcc44';
            optBtn.style.pointerEvents = 'none';
            showToast('Đang tối ưu hệ thống...', '🚀');
            setTimeout(() => {
                const cpu = document.getElementById('cpuTemp');
                const gpu = document.getElementById('gpuTemp');
                cpu.textContent = Math.floor(32 + Math.random() * 10);
                gpu.textContent = Math.floor(44 + Math.random() * 12);
                optStatus.textContent = '✅ đã tối ưu!';
                optStatus.style.color = '#66ff99';
                optBtn.style.pointerEvents = 'auto';
                showToast('Tối ưu thành công! Nhiệt độ giảm ✅', '✅');
                setTimeout(() => {
                    optStatus.textContent = '● sẵn sàng';
                    optStatus.style.color = '#66ddff';
                }, 1800);
            }, 1400);
        }

        optBtn.addEventListener('click', runOptimize);
        optBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            runOptimize();
        }, { passive: false });

        // ============================================================
        // 8. MÔ PHỎNG NHIỆT ĐỘ & FPS
        // ============================================================
        setInterval(() => {
            const cpu = document.getElementById('cpuTemp');
            const gpu = document.getElementById('gpuTemp');
            if (!cpu || !gpu) return;
            const c = parseInt(cpu.textContent) + Math.floor(Math.random() * 3 - 1);
            const g = parseInt(gpu.textContent) + Math.floor(Math.random() * 3 - 1);
            cpu.textContent = Math.max(30, Math.min(75, c));
            gpu.textContent = Math.max(40, Math.min(85, g));
        }, 4000);

        setInterval(() => {
            const fps = document.getElementById('fpsCounter');
            const val = 120 + Math.floor(Math.random() * 40);
            fps.textContent = `⚡ ${val} FPS`;
        }, 3000);

        // ============================================================
        // 9. KHỞI TẠO VỊ TRÍ
        // ============================================================
        window.addEventListener('load', () => {
            const rect = menu.getBoundingClientRect();
            const left = (window.innerWidth - rect.width) / 2;
            const top = (window.innerHeight - rect.height) / 2;
            menu.style.left = left + 'px';
            menu.style.top = top + 'px';
            menu.style.position = 'fixed';
        });

        // Khởi tạo scroll dot
        scrollDot.style.background = '#66ff99';

        console.log('🌸 Ryzen Menu loaded — UI mockup only. Scroll lock active.');
    </script>
</body>
</html>
